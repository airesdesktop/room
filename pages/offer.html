<!DOCTYPE html>
<html lang="en" id="page">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>an offer for you.</title>
    <link rel="icon" type="image/x-icon" href="../resources/logo.ico">
    <link href="../styles/reset.css" rel="stylesheet" />
    <link href="../styles/style.css" rel="stylesheet" />
</head>

<body>
    <div>
        <video id="visuals">
            <source src="../resources/media/themessage_thewindow_cut_higher.mp4" type="video/mp4">
        </video>
        <img src="../resources/sprites/blank.jpg" alt="nothing to see here." id="overlay"/>
    </div>

    <div class="dialogue-with-visuals">
        <p id="message">i have an offer for you. <br> <br> it's intestines you shall consume, <br> with no words, but a tune. <br> <br> it's inadequate to talk while eating.</p>
        <button id="answerBtn" onclick="onAnswered()"><p>> i wholeheartly agree on these conditions.</p></button>
    </div>

    <img src="../resources/sprites/cursor-point.png" alt="" class="cursor">
    <img src="../resources/sprites/cursor-tail.png" alt="" class="cursor-tail">
</body>

</html>


<script>

    //page
    var page = document.getElementById("page");
    
    var cursorOffset = 20;

    //cursors
    const cursor = document.querySelector(".cursor");
    const cursorTail = document.querySelector(".cursor-tail");

    var video = document.getElementById("visuals");
    var message = document.getElementById("message");
    const answerfx = new Audio("../resources/audio/interact.wav");
    var btn = document.getElementById("answerBtn");
    var hider = document.getElementById("overlay");


    //functions
    function onAnswered() {
        answerfx.play();
        video.play();
        video.volume = 0.7;
        message.innerHTML = "* your throat tightens, it's hard to talk."
        btn.innerHTML = '(you do not have the right of speach this moment, nor at any point before or after this message...)';
        document.title = "at last, a breeze";
        //hider.remove();
        video.addEventListener('ended',function() {window.location.href = '../pages/end.html';})
    };


    //check if mouse is on the page
    page.addEventListener("mouseenter", () => {
        cursorTail.style.width = "30px";
        cursorTail.style.height = "30px";
        cursor.style.width = "60px";
        cursor.style.height = "60px";
    });
    page.addEventListener("mouseleave", () => {
        cursorTail.style.width = "0px";
        cursorTail.style.height = "0px";
        cursor.style.width = "0px";
        cursor.style.height = "0px";
    });


    //mouse movement
    document.addEventListener("mousemove", (e) => {
        //cursor pointer
        cursor.style.left = e.pageX + cursorOffset + "px";
        cursor.style.top = e.pageY + cursorOffset + "px";
        //cursor tail
        cursorTail.style.left = e.pageX + cursorOffset + "px";
        cursorTail.style.top = e.pageY + cursorOffset + "px";
    });


    //mouse clicks, horribly separated for now...
    document.addEventListener("mousedown", () => {
        cursor.style.width = "50px";
        cursor.style.height = "50px";
        cursor.src = "../resources/sprites/cursor-point-focus.png";
        cursorOffset = 0;
        cursor.style.left = e.pageX + cursorOffset + "px";
        cursor.style.top = e.pageY + cursorOffset + "px";
    });
    document.addEventListener("mouseup", () => {
        cursor.style.width = "60px";
        cursor.style.height = "60px";
        cursor.src = "../resources/sprites/cursor-point.png";
        cursorOffset = 20;
        cursor.style.left = e.pageX + cursorOffset + "px";
        cursor.style.top = e.pageY + cursorOffset + "px";
    });

    document.addEventListener("mousedown", () => {
        cursorTail.style.width = "40px";
        cursorTail.style.height = "40px";
        cursorTail.style.transition = "all 0.002s ease";
        cursorTail.src = "../resources/sprites/cursor-tail-focus.png";
        cursorOffset = 0;
        cursorTail.style.left = e.pageX + cursorOffset + "px";
        cursorTail.style.top = e.pageY + cursorOffset + "px";
    });
    document.addEventListener("mouseup", () => {
        cursorTail.style.width = "30px";
        cursorTail.style.height = "30px";
        cursorTail.style.transition = "all 0.008s ease-out";
        cursorTail.src = "../resources/sprites/cursor-tail.png";
        cursorOffset = 20;
        cursorTail.style.left = e.pageX + cursorOffset + "px";
        cursorTail.style.top = e.pageY + cursorOffset + "px";
    });


    //mouse on button
    btn.addEventListener('mouseover', function() {
        cursor.src = "../resources/sprites/cursor-point-hover.png";
    });
    btn.addEventListener('mouseout', function() {
        cursor.src = "../resources/sprites/cursor-point.png";
    });

</script>
