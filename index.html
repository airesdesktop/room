<!DOCTYPE html>
<html lang="en" id="page">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Macrosystems Web</title>
        <link rel="icon" type="image/x-icon" href="resources/logo.ico">
        <link href="styles/reset.css" rel="stylesheet" />
        <link href="styles/ms-style.css" rel="stylesheet" />
    </head>

    <body>
        <div id="banner">
            <img src="resources/images/logo.webp" alt="MACROSYSTEMS CORPORATION" id="logo">
        </div>

        <section id="dialogue">
            <section id="dialogue-box">
                <div>
                    <p id="message">404<br>page not found!</p>
                </div>
                <div id="btn-area">
                    <button onclick="unlock()" id="btn"><p>back to homepage</p></button>
                </div>
            </section>
        </section>

        <footer id="foot">
            <div>
                <p>MACROSYSTEMS INCORPORATED, SINCE 1993</p>
            </div>
        </footer>
    </body>

</html>


<script>

    //page
    var page = document.getElementById("page");

    var message = document.getElementById("message");
    const clickfx = new Audio("/resources/audio/step.wav");
    var banner = document.getElementById("banner");
    var btn = document.getElementById("btn");
    var logo = document.getElementById("logo");
    var foot = document.getElementById("foot");

    btn.addEventListener("click", () => {
        btn.style.border = "inset";
    })

    //functions
    function unlock() {
        clickfx.play();
        message.style.color = "red";
        logo.src = "resources/images/logo-alt.webp"
        foot.innerHTML = "MACROSYSTEMS INCORPORATED, SINCE 1986"
        banner.style.background = "url('resources/images/bg-alt.jpg')";
        message.innerHTML = "0x00000803 <br> HOST NOT FOUND"
        document.title = "WHO ARE YOU?";
        redirect();
    };

    function redirect() {
        setTimeout(function() {window.location.href = 'pages/offer.html'}, 100);
    }


    //check if mouse is on the page
    page.addEventListener("mouseenter", () => {
        cursorTail.style.width = "30px";
        cursorTail.style.height = "30px";
        cursor.style.width = "60px";
        cursor.style.height = "60px";
    });
    page.addEventListener("mouseleave", () => {
        cursorTail.style.width = "0px";
        cursorTail.style.height = "0px";
        cursor.style.width = "0px";
        cursor.style.height = "0px";
    });


    //mouse movement
    document.addEventListener("mousemove", (e) => {
        //cursor pointer
        cursor.style.left = e.pageX + cursorOffset + "px";
        cursor.style.top = e.pageY + cursorOffset + "px";
        //cursor tail
        cursorTail.style.left = e.pageX + cursorOffset + "px";
        cursorTail.style.top = e.pageY + cursorOffset + "px";
    });


    //mouse clicks, horribly separated for now...
    document.addEventListener("mousedown", () => {
        cursor.style.width = "50px";
        cursor.style.height = "50px";
        cursor.src = "../resources/sprites/cursor-point-focus.png";
        cursorOffset = 0;
        cursor.style.left = e.pageX + cursorOffset + "px";
        cursor.style.top = e.pageY + cursorOffset + "px";
    });
    document.addEventListener("mouseup", () => {
        cursor.style.width = "60px";
        cursor.style.height = "60px";
        cursor.src = "../resources/sprites/cursor-point.png";
        cursorOffset = 20;
        cursor.style.left = e.pageX + cursorOffset + "px";
        cursor.style.top = e.pageY + cursorOffset + "px";
    });

    document.addEventListener("mousedown", () => {
        cursorTail.style.width = "40px";
        cursorTail.style.height = "40px";
        cursorTail.style.transition = "all 0.002s ease";
        cursorTail.src = "../resources/sprites/cursor-tail-focus.png";
        cursorOffset = 0;
        cursorTail.style.left = e.pageX + cursorOffset + "px";
        cursorTail.style.top = e.pageY + cursorOffset + "px";
    });
    document.addEventListener("mouseup", () => {
        cursorTail.style.width = "30px";
        cursorTail.style.height = "30px";
        cursorTail.style.transition = "all 0.008s ease-out";
        cursorTail.src = "../resources/sprites/cursor-tail.png";
        cursorOffset = 20;
        cursorTail.style.left = e.pageX + cursorOffset + "px";
        cursorTail.style.top = e.pageY + cursorOffset + "px";
    });


    //mouse on button
    btn.addEventListener('mouseover', function() {
        cursor.src = "../resources/sprites/cursor-point-hover.png";
    });
    btn.addEventListener('mouseout', function() {
        cursor.src = "../resources/sprites/cursor-point.png";
    });

</script>
